name: Test

on:
  pull_request:
  push:

jobs:
  v7-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cstate/cstate
          ref: v7
          path: cstate-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          CSTATE_V7_FIXTURE: ${{ github.workspace }}/cstate-contract/test/fixtures/v7-index.json
      - name: Verify hostile record content in Chromium
        run: |
          browser_tools="$RUNNER_TEMP/cstate-browser-tools"
          npm install --prefix "$browser_tools" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          CSTATE_PLAYWRIGHT_MODULE="$browser_tools/node_modules/playwright" npm run test:browser
        env:
          CSTATE_V7_FIXTURE: ${{ github.workspace }}/cstate-contract/test/fixtures/v7-index.json
